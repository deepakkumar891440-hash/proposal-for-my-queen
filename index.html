<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>A Special Invite For You ✨</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,800;1,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --hot-pink: #ff1358;
      --deep-rose: #d90368;
      --glow-pink: rgba(255, 19, 88, 0.4);
      --text-main: #2b0b18;
      --text-sub: #785265;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: radial-gradient(circle at 50% 25%, #fff0f5 0%, #ffd1df 48%, #ffaec3 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      position: relative;
    }

    /* Ambient Floating Hearts */
    .sky-hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .heart-fly {
      position: absolute;
      bottom: -30px;
      animation: flyUp 5.5s linear infinite;
      user-select: none;
    }

    @keyframes flyUp {
      0% { transform: translateY(0) scale(0.6) rotate(0deg); opacity: 0; }
      20% { opacity: 0.85; }
      80% { opacity: 0.85; }
      100% { transform: translateY(-105vh) scale(1.2) rotate(360deg); opacity: 0; }
    }

    /* Perfect SVG Heart Wrapper */
    .heart-stage {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 390px;
      height: 480px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: gentleHeartbeat 3.2s infinite ease-in-out;
    }

    @keyframes gentleHeartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    /* SVG Heart Background */
    .heart-svg-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      filter: drop-shadow(0 20px 35px rgba(217, 3, 104, 0.28)) drop-shadow(0 0 20px rgba(255, 255, 255, 0.9));
    }

    /* Content Area inside Heart */
    .card-content {
      position: relative;
      z-index: 3;
      width: 74%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: -30px; /* Dil ke core center me align */
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #ffe3ec;
      border: 1px solid #ffb5cb;
      color: var(--hot-pink);
      padding: 4px 12px;
      border-radius: 50px;
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 21px;
      color: var(--text-main);
      line-height: 1.22;
      margin-bottom: 6px;
    }

    p.subtitle {
      font-size: 12px;
      color: var(--text-sub);
      line-height: 1.45;
      margin-bottom: 16px;
      padding: 0 4px;
    }

    /* Buttons Screen 1 */
    .btn-wrap {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 52px;
      position: relative;
    }

    .btn-act {
      padding: 12px 22px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .btn-yes {
      background: linear-gradient(135deg, #ff1358 0%, #ff527f 100%);
      color: #fff;
      box-shadow: 0 8px 20px var(--glow-pink);
    }

    .btn-yes:active {
      transform: scale(0.95);
    }

    .btn-no {
      background: #ffffff;
      color: var(--text-sub);
      border: 1.5px solid #ffccd9;
    }

    /* ZERO-SCROLL 2x2 Grid Layout */
    .zero-scroll-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      width: 100%;
    }

    .grid-card {
      background: #ffffff;
      border: 1.5px solid #ffccd9;
      border-radius: 14px;
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(217, 3, 104, 0.05);
      transition: all 0.2s ease;
    }

    .grid-card:hover, .grid-card:active {
      background: var(--hot-pink);
      border-color: var(--hot-pink);
      transform: scale(1.02);
      box-shadow: 0 6px 14px var(--glow-pink);
    }

    .grid-card .icon {
      font-size: 20px;
      line-height: 1;
    }

    .grid-card .title {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.25;
    }

    .grid-card:hover .title, .grid-card:active .title {
      color: #ffffff;
    }

    /* Time Picker Box */
    .time-compact-box {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    .time-slot-input {
      width: 85%;
      background: #ffffff;
      border: 2px solid #ff9ebb;
      color: var(--hot-pink);
      font-size: 22px;
      font-weight: 800;
      text-align: center;
      padding: 8px;
      border-radius: 14px;
      outline: none;
      box-shadow: 0 4px 10px rgba(255, 19, 88, 0.08);
    }

    /* Final Summary Board */
    .final-receipt {
      width: 100%;
      background: rgba(255, 255, 255, 0.9);
      border: 1px dashed #ff8fa3;
      border-radius: 14px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 8px;
    }

    .receipt-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      padding-bottom: 3px;
      border-bottom: 1px solid #ffe1e8;
    }

    .receipt-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .receipt-row .label {
      color: var(--text-sub);
    }

    .receipt-row .val {
      color: var(--hot-pink);
      font-weight: 700;
      text-align: right;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Floating Ambient Hearts -->
  <div class="sky-hearts" id="skyHearts"></div>

  <div class="heart-stage">
    <!-- Smooth Vector Heart Base -->
    <svg class="heart-svg-bg" viewBox="0 0 500 480" preserveAspectRatio="none">
      <defs>
        <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="55%" stop-color="#fff5f8" />
          <stop offset="100%" stop-color="#ffd5e2" />
        </linearGradient>
      </defs>
      <path d="M 250,115 
               C 215,30 115,20 50,85 
               C -25,160 10,270 250,455 
               C 490,270 525,160 450,85 
               C 385,20 285,30 250,115 Z" 
            fill="url(#heartGradient)" 
            stroke="#ffffff" 
            stroke-width="8" />
    </svg>

    <!-- Screen 1: Proposal Gate -->
    <div class="card-content" id="screenProposal">
      <div class="badge">🌸 EXCLUSIVE INVITATION</div>
      <h1>Will You Go On A Date With Me?</h1>
      <p class="subtitle">I've planned something very special, but it's incomplete without you.</p>

      <div class="btn-wrap">
        <button class="btn-act btn-yes" id="yesBtn" onclick="onAccept(event)">Yes, absolutely! 💖</button>
        <button class="btn-act btn-no" id="noBtn" onmouseover="dodgeNo()" onclick="dodgeNo()">No 🙈</button>
      </div>
    </div>

    <!-- Screen 2: 3 Questions (Zero-Scroll 2x2 Grid) -->
    <div class="card-content hidden" id="screenQuiz">
      <div class="badge" id="stepPill">QUESTION 01 OF 03</div>
      <h1 id="quizQuestion" style="font-size: 17px; min-height: 40px; display:flex; align-items:center;">Loading...</h1>

      <div id="quizContainer" style="width: 100%;"></div>
    </div>

    <!-- Screen 3: Date Confirmed -->
    <div class="card-content hidden" id="screenFinal">
      <div class="badge">💌 IT'S A MATCH</div>
      <h1 style="font-size: 19px;">I am Ready to Go! 🎉</h1>
      <p class="subtitle" style="margin-bottom: 6px;">Here is our date plan:</p>

      <div class="final-receipt" id="receiptBox"></div>

      <button class="btn-act btn-yes" style="width: 100%; font-size: 13px; padding: 10px 14px;" onclick="redirectWhatsApp()">
        Confirm on WhatsApp 💬
      </button>
      <p style="font-size: 10px; color: var(--text-sub); margin-top: 5px;">Opening WhatsApp automatically... 🚀</p>
    </div>
  </div>

  <script>
    // ================= CONFIGURATION =================
    // Apna 10-digit mobile number country code ke sath likhein (Bina '+' sign ke)
    const YOUR_PHONE_NUMBER = "91XXXXXXXXXX"; 
    // =================================================

    // Continuous floating hearts
    const skyHearts = document.getElementById('skyHearts');
    const heartIcons = ['💖', '💕', '💗', '🌸', '✨', '💓', '💘'];

    function spawnHeart() {
      const el = document.createElement('span');
      el.className = 'heart-fly';
      el.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];
      el.style.left = Math.random() * 100 + 'vw';
      el.style.fontSize = (Math.random() * 12 + 14) + 'px';
      el.style.animationDuration = (Math.random() * 2 + 4.5) + 's';
      skyHearts.appendChild(el);
      setTimeout(() => el.remove(), 6000);
    }
    setInterval(spawnHeart, 300);

    // Heart explosion on tap
    function heartBlast(x, y) {
      confetti({
        particleCount: 45,
        spread: 75,
        origin: { 
          x: x ? x / window.innerWidth : 0.5, 
          y: y ? y / window.innerHeight : 0.55 
        },
        colors: ['#ff1358', '#ff758c', '#ffffff', '#ff9ebb'],
        shapes: ['circle'],
        scalar: 1.1
      });
    }

    // Playful "No" Dodge
    const noBtn = document.getElementById('noBtn');
    function dodgeNo() {
      const x = (Math.random() - 0.5) * 110;
      const y = (Math.random() - 0.5) * 50;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    }

    // 3 Exact English Questions (Compact Grid Data)
    const questions = [
      {
        type: "grid",
        title: "Where should we go?",
        options: [
          { text: "Rooftop Under Stars", icon: "🌃" },
          { text: "Aesthetic Cozy Café", icon: "☕" },
          { text: "Peaceful Beach Walk", icon: "🌊" },
          { text: "Fun Theme Park", icon: "🎡" }
        ]
      },
      {
        type: "time",
        title: "What time should we meet?",
      },
      {
        type: "grid",
        title: "What are we eating?",
        options: [
          { text: "Pizza & Creamy Pasta", icon: "🍕" },
          { text: "Hot Dim Sums & Ramen", icon: "🍜" },
          { text: "Street Food Tour", icon: "🌮" },
          { text: "Waffles & Brownies", icon: "🍨" }
        ]
      }
    ];

    let currentQ = 0;
    const userChoices = [];

    function onAccept(e) {
      heartBlast(e?.clientX, e?.clientY);
      document.getElementById('screenProposal').classList.add('hidden');
      document.getElementById('screenQuiz').classList.remove('hidden');
      renderQuestion();
    }

    function renderQuestion() {
      const q = questions[currentQ];
      document.getElementById('stepPill').innerText = `QUESTION 0${currentQ + 1} OF 03`;
      document.getElementById('quizQuestion').innerText = q.title;

      const container = document.getElementById('quizContainer');
      container.innerHTML = '';

      if (q.type === "grid") {
        const grid = document.createElement('div');
        grid.className = 'zero-scroll-grid';
        q.options.forEach(opt => {
          const item = document.createElement('div');
          item.className = 'grid-card';
          item.innerHTML = `<span class="icon">${opt.icon}</span><span class="title">${opt.text}</span>`;
          item.onclick = (e) => {
            heartBlast(e.clientX, e.clientY);
            saveAnswer(q.title, opt.text);
          };
          grid.appendChild(item);
        });
        container.appendChild(grid);
      } else if (q.type === "time") {
        const box = document.createElement('div');
        box.className = 'time-compact-box';
        box.innerHTML = `
          <input type="time" id="exactTime" class="time-slot-input" value="19:30" required />
          <button class="btn-act btn-yes" style="width: 85%; padding: 10px;" onclick="confirmTime(event)">Lock In Time ⏰</button>
        `;
        container.appendChild(box);
      }
    }

    function confirmTime(e) {
      const val = document.getElementById('exactTime').value;
      if (!val) return;

      heartBlast(e.clientX, e.clientY);
      const [h, m] = val.split(':');
      const hourNum = parseInt(h, 10);
      const ampm = hourNum >= 12 ? 'PM' : 'AM';
      const formatted = `${hourNum % 12 || 12}:${m} ${ampm}`;
      saveAnswer("Meeting Time", formatted);
    }

    function saveAnswer(question, choice) {
      userChoices.push({ question, choice });
      currentQ++;

      if (currentQ < questions.length) {
        setTimeout(renderQuestion, 200);
      } else {
        setTimeout(showFinal, 200);
      }
    }

    function showFinal() {
      document.getElementById('screenQuiz').classList.add('hidden');
      document.getElementById('screenFinal').classList.remove('hidden');

      confetti({ particleCount: 130, spread: 90, origin: { y: 0.55 } });

      const box = document.getElementById('receiptBox');
      box.innerHTML = '';
      userChoices.forEach(item => {
        const row = document.createElement('div');
        row.className = 'receipt-row';
        row.innerHTML = `<span class="label">${item.question}</span><span class="val">${item.choice}</span>`;
        box.appendChild(row);
      });

      // 1.2 second baad automatic WhatsApp open
      setTimeout(redirectWhatsApp, 1200);
    }

    function redirectWhatsApp() {
      const msg = `Hey! I said YES, I am ready to go! 🥰✨%0A%0AHere are my choices:%0A📍 Location: ${userChoices[0]?.choice}%0A⏰ Time: ${userChoices[1]?.choice}%0A🍕 Food: ${userChoices[2]?.choice}%0A%0ACan't wait! 💖`;
      window.location.href = `https://wa.me/${YOUR_PHONE_NUMBER}?text=${msg}`;
    }
  </script>
</body>
</html>
