<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Special Invite For You ✨</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #ff3366;
      --primary-hover: #e02456;
      --card-bg: rgba(255, 255, 255, 0.88);
      --card-border: rgba(255, 255, 255, 0.95);
      --text-dark: #3a1c28;
      --text-muted: #7d6b73;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #ffeef2 0%, #ffd6e0 45%, #ffc2d1 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
      padding: 20px;
    }

    /* Floating Hearts Layer */
    .heart-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .floating-heart {
      position: absolute;
      bottom: -40px;
      animation: floatUpward 7s linear infinite;
      user-select: none;
    }

    @keyframes floatUpward {
      0% {
        transform: translateY(0) scale(0.6) rotate(0deg);
        opacity: 0;
      }
      20% {
        opacity: 0.85;
      }
      80% {
        opacity: 0.85;
      }
      100% {
        transform: translateY(-115vh) scale(1.2) rotate(360deg);
        opacity: 0;
      }
    }

    /* White & Pink Glass Card */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 450px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 2px solid var(--card-border);
      border-radius: 36px;
      padding: 38px 28px;
      box-shadow: 0 25px 50px rgba(255, 51, 102, 0.18), 0 0 0 1px rgba(255, 255, 255, 0.6) inset;
      text-align: center;
      animation: popIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.95) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      border-radius: 50px;
      background: #ffe5ec;
      border: 1px solid #ffccd5;
      color: var(--primary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 30px;
      color: var(--text-dark);
      margin-bottom: 10px;
      line-height: 1.25;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 26px;
    }

    /* Buttons */
    .btn-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      position: relative;
      min-height: 60px;
    }

    .btn-action {
      padding: 14px 34px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .btn-yes {
      background: linear-gradient(135deg, #ff3366 0%, #ff5e7e 100%);
      color: #ffffff;
      box-shadow: 0 10px 25px rgba(255, 51, 102, 0.35);
    }

    .btn-yes:hover {
      transform: scale(1.05);
      box-shadow: 0 14px 30px rgba(255, 51, 102, 0.45);
    }

    .btn-no {
      background: #ffffff;
      color: var(--text-muted);
      border: 1.5px solid #ffccd5;
    }

    /* Progress Track */
    .progress-wrap {
      width: 100%;
      height: 7px;
      background: #ffe5ec;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 18px;
    }

    .progress-bar {
      height: 100%;
      width: 33.33%;
      background: linear-gradient(90deg, #ff758c, #ff3366);
      border-radius: 10px;
      transition: width 0.35s ease;
    }

    .step-tag {
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .q-title {
      font-family: 'Playfair Display', serif;
      font-size: 21px;
      color: var(--text-dark);
      margin-bottom: 22px;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Options List */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-card {
      background: #ffffff;
      border: 1.5px solid #ffe5ec;
      padding: 15px 20px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-dark);
      text-align: left;
      box-shadow: 0 4px 12px rgba(255, 107, 129, 0.06);
      transition: all 0.25s ease;
    }

    .option-card:hover {
      background: #fff0f3;
      border-color: var(--primary);
      transform: translateX(5px);
      color: var(--primary);
    }

    .option-icon {
      font-size: 20px;
    }

    /* Pink Time Selector */
    .time-selector-box {
      background: #ffffff;
      border: 1.5px solid #ffe5ec;
      border-radius: 24px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      box-shadow: 0 4px 14px rgba(255, 107, 129, 0.08);
    }

    .time-input {
      width: 100%;
      background: #fff0f3;
      border: 2px solid #ffccd5;
      color: var(--primary);
      font-size: 26px;
      font-weight: 700;
      text-align: center;
      padding: 12px;
      border-radius: 16px;
      outline: none;
      cursor: pointer;
    }

    /* Summary Card */
    .summary-card {
      background: #ffffff;
      border: 1.5px dashed #ffb3c1;
      border-radius: 20px;
      padding: 16px;
      margin: 20px 0;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .summary-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid #ffe5ec;
    }

    .summary-line:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .summary-line .q-key {
      color: var(--text-muted);
      font-weight: 500;
    }

    .summary-line .q-val {
      color: var(--primary);
      font-weight: 700;
    }

    .auto-notice {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 10px;
      animation: pulseText 1.5s infinite;
    }

    @keyframes pulseText {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Floating Hearts Background -->
  <div class="heart-bg" id="heartBg"></div>

  <!-- Screen 1: Proposal -->
  <div class="card" id="proposalGate">
    <div class="pill">🌸 Exclusive Invitation</div>
    <h1>Will You Go On A Date With Me?</h1>
    <p class="subtitle">I've planned something very special, but it's incomplete without you.</p>

    <div class="btn-row">
      <button class="btn-action btn-yes" id="yesBtn" onclick="startQuestions()">Yes, absolutely! 💖</button>
      <button class="btn-action btn-no" id="noBtn" onmouseover="dodgeNo()" onclick="dodgeNo()">No 🙈</button>
    </div>
  </div>

  <!-- Screen 2: 3 Simple Questions -->
  <div class="card hidden" id="questionGate">
    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="step-tag" id="stepCounter">Question 01 of 03</div>
    <h2 class="q-title" id="questionTitle">Loading...</h2>
    
    <div id="contentBox"></div>
  </div>

  <!-- Screen 3: Date Confirmed & Auto WhatsApp -->
  <div class="card hidden" id="finalGate">
    <div class="pill">💌 Date Confirmed</div>
    <h1>It's A Match! 🎉❤️</h1>
    <p class="subtitle">Here are all your choices for our date:</p>

    <div class="summary-card" id="summaryView"></div>

    <button class="btn-action btn-yes" style="width: 100%;" onclick="sendWhatsAppNotification()">
      Confirm with Me on WhatsApp 💬
    </button>
    <p class="auto-notice" id="autoRedirectMsg">Opening WhatsApp automatically in a second... 🚀</p>
  </div>

  <script>
    // ================= CONFIGURATION =================
    // Yahan apna 10-digit mobile number country code ke sath daalein (Bina '+' sign ke)
    const YOUR_PHONE_NUMBER = "91XXXXXXXXXX"; 
    // =================================================

    // Continuous Floating Pink Hearts
    const heartBg = document.getElementById('heartBg');
    const hearts = ['💖', '💕', '💗', '🌸', '✨', '💓'];

    function spawnHeart() {
      const el = document.createElement('span');
      el.className = 'floating-heart';
      el.innerText = hearts[Math.floor(Math.random() * hearts.length)];
      el.style.left = Math.random() * 100 + 'vw';
      el.style.fontSize = (Math.random() * 14 + 16) + 'px';
      el.style.animationDuration = (Math.random() * 3 + 5) + 's';
      heartBg.appendChild(el);
      setTimeout(() => el.remove(), 7500);
    }
    setInterval(spawnHeart, 320);

    // Playful "No" Dodge
    const noBtn = document.getElementById('noBtn');
    function dodgeNo() {
      const offsetX = (Math.random() - 0.5) * 140;
      const offsetY = (Math.random() - 0.5) * 80;
      noBtn.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
    }

    // 3 Exact English Questions
    const questions = [
      {
        type: "choice",
        title: "Where should we go?",
        options: [
          { text: "Romantic Rooftop with City Lights", icon: "🌃" },
          { text: "Cozy Café with Aesthetic Vibes", icon: "☕" },
          { text: "Peaceful Beach / Lakeside Walk", icon: "🌊" },
          { text: "Lively Amusement Park / Arcade", icon: "🎡" }
        ]
      },
      {
        type: "time",
        title: "What exact time should I pick you up?",
        subtitle: "Select the exact time:"
      },
      {
        type: "choice",
        title: "What are we eating?",
        options: [
          { text: "Wood-fired Pizza & Creamy Pasta", icon: "🍕" },
          { text: "Handmade Asian Dim Sums & Ramen", icon: "🍜" },
          { text: "Street Food & Tangy Snacks Tour", icon: "🌮" },
          { text: "Dessert Feast (Waffles & Brownies)", icon: "🍨" }
        ]
      }
    ];

    let currentQ = 0;
    const answers = [];

    function startQuestions() {
      confetti({ particleCount: 110, spread: 70, origin: { y: 0.6 } });
      document.getElementById('proposalGate').classList.add('hidden');
      document.getElementById('questionGate').classList.remove('hidden');
      renderCurrentQuestion();
    }

    function renderCurrentQuestion() {
      const q = questions[currentQ];
      document.getElementById('stepCounter').innerText = `Question 0${currentQ + 1} of 03`;
      document.getElementById('questionTitle').innerText = q.title;
      document.getElementById('progressBar').style.width = ((currentQ + 1) / 3) * 100 + '%';

      const contentBox = document.getElementById('contentBox');
      contentBox.innerHTML = '';

      if (q.type === "choice") {
        const list = document.createElement('div');
        list.className = 'options-list';
        q.options.forEach(opt => {
          const btn = document.createElement('div');
          btn.className = 'option-card';
          btn.innerHTML = `<span class="option-icon">${opt.icon}</span><span>${opt.text}</span>`;
          btn.onclick = () => recordAnswer(q.title, opt.text);
          list.appendChild(btn);
        });
        contentBox.appendChild(list);
      } else if (q.type === "time") {
        const wrap = document.createElement('div');
        wrap.className = 'time-selector-box';
        wrap.innerHTML = `
          <input type="time" id="exactTimeInput" class="time-input" value="19:30" required />
          <button class="btn-action btn-yes" style="width:100%;" onclick="confirmTimeSelection()">
            Set This Time ⏰
          </button>
        `;
        contentBox.appendChild(wrap);
      }
    }

    function confirmTimeSelection() {
      const rawTime = document.getElementById('exactTimeInput').value;
      if (!rawTime) {
        alert("Please select a time!");
        return;
      }
      
      const [h, m] = rawTime.split(':');
      const hourNum = parseInt(h, 10);
      const ampm = hourNum >= 12 ? 'PM' : 'AM';
      const formattedHour = hourNum % 12 || 12;
      const formattedTime = `${String(formattedHour).padStart(2, '0')}:${m} ${ampm}`;

      recordAnswer("Pick-up Time", formattedTime);
    }

    function recordAnswer(question, choice) {
      answers.push({ question, choice });
      currentQ++;

      if (currentQ < questions.length) {
        renderCurrentQuestion();
      } else {
        showFinalCard();
      }
    }

    function showFinalCard() {
      document.getElementById('questionGate').classList.add('hidden');
      document.getElementById('finalGate').classList.remove('hidden');

      confetti({ particleCount: 160, spread: 90, origin: { y: 0.55 } });

      const summaryView = document.getElementById('summaryView');
      summaryView.innerHTML = '';

      answers.forEach(item => {
        const row = document.createElement('div');
        row.className = 'summary-line';
        row.innerHTML = `<span class="q-key">${item.question}</span><span class="q-val">${item.choice}</span>`;
        summaryView.appendChild(row);
      });

      // 1.5 Second me WhatsApp auto-open ho jayega
      setTimeout(() => {
        sendWhatsAppNotification();
      }, 1500);
    }

    function sendWhatsAppNotification() {
      const text = `Hey! I said YES! 🥰✨%0A%0AHere are my plans for our date:%0A📍 *Place:* ${answers[0]?.choice}%0A⏰ *Pick-up Time:* ${answers[1]?.choice}%0A🍕 *Food:* ${answers[2]?.choice}%0A%0ASee you at ${answers[1]?.choice}! 💖`;
      window.location.href = `https://wa.me/${YOUR_PHONE_NUMBER}?text=${text}`;
    }
  </script>
</body>
</html>
