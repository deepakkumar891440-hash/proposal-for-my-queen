<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Special Invite For You ✨</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #ff1e56;
      --accent: #9d4edd;
      --bg-dark: #0f0c1b;
      --card-bg: rgba(22, 16, 38, 0.75);
      --border-glow: rgba(255, 255, 255, 0.18);
      --text-main: #ffffff;
      --text-dim: #b8b0c8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 15% 15%, rgba(255, 30, 86, 0.35) 0px, transparent 50%),
        radial-gradient(at 85% 85%, rgba(157, 78, 221, 0.4) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(255, 107, 107, 0.15) 0px, transparent 55%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
      padding: 20px;
    }

    .sparkle-field {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .sparkle {
      position: absolute;
      bottom: -30px;
      animation: drift 8s linear infinite;
      user-select: none;
      opacity: 0.65;
    }

    @keyframes drift {
      0% { transform: translateY(0) scale(0.6); opacity: 0; }
      30% { opacity: 0.8; }
      100% { transform: translateY(-110vh) scale(1.2) rotate(360deg); opacity: 0; }
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-glow);
      border-radius: 36px;
      padding: 40px 30px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45), 0 0 35px rgba(255, 30, 86, 0.2);
      text-align: center;
      animation: popIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.94) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 50px;
      background: rgba(255, 30, 86, 0.15);
      border: 1px solid rgba(255, 30, 86, 0.3);
      color: #ff6b8b;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      color: var(--text-main);
      margin-bottom: 12px;
      line-height: 1.25;
    }

    p.subtitle {
      color: var(--text-dim);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .btn-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      position: relative;
      min-height: 60px;
    }

    .btn-action {
      padding: 15px 36px;
      border-radius: 22px;
      font-size: 16px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .btn-yes {
      background: linear-gradient(135deg, #ff1e56 0%, #9d4edd 100%);
      color: #ffffff;
      box-shadow: 0 10px 25px rgba(255, 30, 86, 0.45);
    }

    .btn-yes:hover {
      transform: scale(1.05);
      box-shadow: 0 14px 32px rgba(255, 30, 86, 0.6);
    }

    .btn-no {
      background: rgba(255, 255, 255, 0.08);
      color: #bbb;
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
    }

    .progress-wrap {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .progress-bar {
      height: 100%;
      width: 33.33%;
      background: linear-gradient(90deg, #ff1e56, #9d4edd);
      border-radius: 10px;
      transition: width 0.35s ease;
    }

    .step-tag {
      font-size: 12px;
      font-weight: 700;
      color: #ff6b8b;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .q-title {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      color: var(--text-main);
      margin-bottom: 24px;
      min-height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 16px 20px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 15px;
      font-weight: 500;
      color: #e5e0f0;
      text-align: left;
      transition: all 0.25s ease;
    }

    .option-card:hover {
      background: rgba(255, 30, 86, 0.15);
      border-color: rgba(255, 30, 86, 0.5);
      transform: translateX(4px);
      color: #ffffff;
    }

    .option-icon {
      font-size: 20px;
    }

    /* Custom Time Picker Module */
    .time-selector-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .time-input {
      width: 100%;
      background: rgba(15, 12, 27, 0.85);
      border: 1.5px solid rgba(255, 30, 86, 0.5);
      color: #ffffff;
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      padding: 14px;
      border-radius: 16px;
      outline: none;
      cursor: pointer;
    }

    .time-input::-webkit-calendar-picker-indicator {
      filter: invert(1);
      cursor: pointer;
      transform: scale(1.3);
      margin-right: 6px;
    }

    .summary-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 16px;
      margin: 20px 0;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .summary-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .summary-line:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .summary-line .q-key {
      color: var(--text-dim);
    }

    .summary-line .q-val {
      color: #ff6b8b;
      font-weight: 700;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="sparkle-field" id="sparkleField"></div>

  <!-- Screen 1: Proposal -->
  <div class="card" id="proposalGate">
    <div class="pill">✨ Exclusive Invitation</div>
    <h1>Will You Go On A Date With Me?</h1>
    <p class="subtitle">I've got something special in mind, but it only works if you're there.</p>

    <div class="btn-row">
      <button class="btn-action btn-yes" id="yesBtn" onclick="startQuestions()">Yes, absolutely! 💖</button>
      <button class="btn-action btn-no" id="noBtn" onmouseover="dodgeNo()" onclick="dodgeNo()">No 🙈</button>
    </div>
  </div>

  <!-- Screen 2: Dynamic Questions -->
  <div class="card hidden" id="questionGate">
    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="step-tag" id="stepCounter">Question 01 of 03</div>
    <h2 class="q-title" id="questionTitle">Loading...</h2>
    
    <div id="contentBox"></div>
  </div>

  <!-- Screen 3: Final Confirmation & Notification -->
  <div class="card hidden" id="finalGate">
    <div class="pill">💌 Date Locked In</div>
    <h1>It's A Date! 🎉</h1>
    <p class="subtitle">Here are your selected details:</p>

    <div class="summary-card" id="summaryView"></div>

    <button class="btn-action btn-yes" style="width: 100%; margin-top: 10px;" onclick="sendWhatsAppNotification()">
      Confirm via WhatsApp 💬
    </button>
    <p style="font-size: 12px; color: var(--text-dim); margin-top: 12px;">Click to let me know the exact time and choices!</p>
  </div>

  <script>
    // ================= CONFIGURATION =================
    // Apna 10-digit mobile number country code ke sath likhein (bina '+' ke)
    const YOUR_PHONE_NUMBER = "91XXXXXXXXXX"; 

    // Optional: Silent email alert ke liye (e.g. "https://formspree.io/f/xyzabced")
    const FORMSPREE_ENDPOINT = "";
    // =================================================

    const sparkleField = document.getElementById('sparkleField');
    const icons = ['✨', '🌸', '💫', '💖', '🤍'];

    function createSparkle() {
      const sp = document.createElement('span');
      sp.className = 'sparkle';
      sp.innerText = icons[Math.floor(Math.random() * icons.length)];
      sp.style.left = Math.random() * 100 + 'vw';
      sp.style.fontSize = (Math.random() * 12 + 14) + 'px';
      sp.style.animationDuration = (Math.random() * 3 + 5) + 's';
      sparkleField.appendChild(sp);
      setTimeout(() => sp.remove(), 7500);
    }
    setInterval(createSparkle, 350);

    const noBtn = document.getElementById('noBtn');
    function dodgeNo() {
      const offsetX = (Math.random() - 0.5) * 140;
      const offsetY = (Math.random() - 0.5) * 80;
      noBtn.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
    }

    const questions = [
      {
        type: "choice",
        title: "Where should we go?",
        options: [
          { text: "Romantic Rooftop with City Lights", icon: "🌃" },
          { text: "Cozy Café with Aesthetic Vibes", icon: "☕" },
          { text: "Peaceful Beach / Lakeside Walk", icon: "🌊" },
          { text: "Lively Amusement Park / Arcade", icon: "🎡" }
        ]
      },
      {
        type: "time",
        title: "What exact time should I pick you up?",
        subtitle: "Pick the exact hour & minute that fits your schedule:"
      },
      {
        type: "choice",
        title: "What are we eating?",
        options: [
          { text: "Wood-fired Pizza & Creamy Pasta", icon: "🍕" },
          { text: "Handmade Asian Dim Sums & Ramen", icon: "🍜" },
          { text: "Street Food & Tangy Snacks Tour", icon: "🌮" },
          { text: "Dessert Feast (Waffles & Brownies)", icon: "🍨" }
        ]
      }
    ];

    let currentQ = 0;
    const answers = [];

    function startQuestions() {
      confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      document.getElementById('proposalGate').classList.add('hidden');
      document.getElementById('questionGate').classList.remove('hidden');
      renderCurrentQuestion();
    }

    function renderCurrentQuestion() {
      const q = questions[currentQ];
      document.getElementById('stepCounter').innerText = `Question 0${currentQ + 1} of 03`;
      document.getElementById('questionTitle').innerText = q.title;
      document.getElementById('progressBar').style.width = ((currentQ + 1) / 3) * 100 + '%';

      const contentBox = document.getElementById('contentBox');
      contentBox.innerHTML = '';

      if (q.type === "choice") {
        const list = document.createElement('div');
        list.className = 'options-list';
        q.options.forEach(opt => {
          const btn = document.createElement('div');
          btn.className = 'option-card';
          btn.innerHTML = `<span class="option-icon">${opt.icon}</span><span>${opt.text}</span>`;
          btn.onclick = () => recordAnswer(q.title, opt.text);
          list.appendChild(btn);
        });
        contentBox.appendChild(list);
      } else if (q.type === "time") {
        const wrap = document.createElement('div');
        wrap.className = 'time-selector-box';
        wrap.innerHTML = `
          <input type="time" id="exactTimeInput" class="time-input" value="19:30" required />
          <button class="btn-action btn-yes" style="width:100%;" onclick="confirmTimeSelection()">
            Set This Time ⏰
          </button>
        `;
        contentBox.appendChild(wrap);
      }
    }

    function confirmTimeSelection() {
      const rawTime = document.getElementById('exactTimeInput').value;
      if (!rawTime) {
        alert("Please pick a time!");
        return;
      }
      
      // Convert 24-hour to readable 12-hour AM/PM format
      const [h, m] = rawTime.split(':');
      const hourNum = parseInt(h, 10);
      const ampm = hourNum >= 12 ? 'PM' : 'AM';
      const formattedHour = hourNum % 12 || 12;
      const formattedTime = `${String(formattedHour).padStart(2, '0')}:${m} ${ampm}`;

      recordAnswer("Pick-up Time", formattedTime);
    }

    function recordAnswer(question, choice) {
      answers.push({ question, choice });
      currentQ++;

      if (currentQ < questions.length) {
        renderCurrentQuestion();
      } else {
        showFinalCard();
      }
    }

    function showFinalCard() {
      document.getElementById('questionGate').classList.add('hidden');
      document.getElementById('finalGate').classList.remove('hidden');

      confetti({ particleCount: 150, spread: 90, origin: { y: 0.55 } });

      const summaryView = document.getElementById('summaryView');
      summaryView.innerHTML = '';

      answers.forEach(item => {
        const row = document.createElement('div');
        row.className = 'summary-line';
        row.innerHTML = `<span class="q-key">${item.question}</span><span class="q-val">${item.choice}</span>`;
        summaryView.appendChild(row);
      });

      if (FORMSPREE_ENDPOINT) {
        fetch(FORMSPREE_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            event: "Proposal Accepted! 🎉",
            location: answers[0]?.choice,
            exact_time: answers[1]?.choice,
            food: answers[2]?.choice,
            submitted_at: new Date().toLocaleString()
          })
        }).catch(err => console.log(err));
      }
    }

    function sendWhatsAppNotification() {
      const text = `Hey! I said YES! 🥰✨%0A%0AHere are my plans for our date:%0A📍 *Place:* ${answers[0]?.choice}%0A⏰ *Pick-up Time:* ${answers[1]?.choice}%0A🍕 *Food:* ${answers[2]?.choice}%0A%0ASee you at ${answers[1]?.choice}! 💖`;
      window.open(`https://wa.me/${YOUR_PHONE_NUMBER}?text=${text}`, '_blank');
    }
  </script>
</body>
</html>
